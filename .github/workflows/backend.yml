name: Backend

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: kindo_test
          POSTGRES_USER: kindo
          POSTGRES_PASSWORD: kindo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run migrations
        working-directory: backend
        env:
          DATABASE_URL: postgres://kindo:kindo@localhost:5432/kindo_test
        run: python manage.py migrate

      - name: Run tests with coverage
        working-directory: backend
        env:
          DATABASE_URL: postgres://kindo:kindo@localhost:5432/kindo_test
        run: pytest -v

      - name: Coverage report
        if: github.event_name == 'pull_request'
        uses: MishaKav/pytest-coverage-comment@v1.2.0
        with:
          pytest-xml-coverage-path: backend/coverage.xml
          title: Backend Coverage
          badge-title: Backend Coverage

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy to Railway
        working-directory: backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --detach
